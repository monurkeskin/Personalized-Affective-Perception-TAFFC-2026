version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      verification:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1

# Legacy NAOqi and TF/Keras manifests require device/model compatibility evidence;
# they are deliberately excluded from automatic version-update PRs, not security alerts.
